name: CI

# Só testes: o deploy é feito pelo AWS CodePipeline (ver cicd/pipeline.yaml),
# então este workflow não precisa de nenhuma credencial da AWS.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Testes (mvn verify)
        run: mvn -B -ntp verify
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/'
          retention-days: 7
