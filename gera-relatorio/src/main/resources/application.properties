avaliacoes.tabela=${TABELA_AVALIACOES:Avaliacoes}
relatorios.bucket=${BUCKET_RELATORIOS:relatorios-local}
relatorio.topico-arn=${TOPICO_RELATORIO:arn:aws:sns:us-east-2:000000000000:relatorio-semanal}

%dev,test.quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5p [%c{2.}] %s%e%n
quarkus.banner.enabled=false

# Na Lambda os logs saem em JSON (CloudWatch Logs Insights consegue filtrar por campo)
quarkus.log.console.json.enabled=true
%dev,test.quarkus.log.console.json.enabled=false
quarkus.log.console.json.additional-field.servico.value=gera-relatorio
