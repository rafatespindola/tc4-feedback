AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TC4 Feedback - avaliacoes, alertas criticos e relatorio semanal

Parameters:
  Stage:
    Type: String
    Default: prod
  AdminEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /tc4-feedback/admin-email
    Description: Parametro do SSM com o e-mail dos administradores (fora do repositorio, que e publico)

Globals:
  Function:
    Runtime: java21
    Architectures: [arm64]
    MemorySize: 1024
    Timeout: 15
    Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
    Tracing: Active

Resources:

  # ---------- Dados ----------
  AvaliacoesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Avaliacoes
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dia
          AttributeType: S
        - AttributeName: criadoEm#id
          AttributeType: S
      KeySchema:
        - AttributeName: dia
          KeyType: HASH
        - AttributeName: criadoEm#id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true        # KMS (chave gerenciada aws/dynamodb)
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  # ---------- Alertas ----------
  # Chave própria: o CloudWatch (alarmes) não publica em tópico cifrado com a chave gerenciada aws/sns
  AlertasKey:
    Type: AWS::KMS::Key
    Properties:
      Description: tc4-feedback - criptografia do topico alertas-criticos
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AdministracaoPelaConta
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AlarmesDoCloudWatch
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlertasKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/tc4-alertas
      TargetKeyId: !Ref AlertasKey

  AlertasCriticosTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: alertas-criticos
      KmsMasterKeyId: !Ref AlertasKey

  AlertasCriticosEmail:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertasCriticosTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ---------- Relatório ----------
  RelatoriosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms        # chave gerenciada aws/s3
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled

  RelatoriosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RelatoriosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SomenteHttps
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RelatoriosBucket.Arn
              - !Sub '${RelatoriosBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  RelatorioSemanalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: relatorio-semanal
      KmsMasterKeyId: alias/aws/sns

  RelatorioSemanalEmail:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RelatorioSemanalTopic
      Protocol: email
      Endpoint: !Ref AdminEmail

  # ---------- API ----------
  AvaliacaoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: tc4-feedback-api
      StageName: !Ref Stage
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: tc4-feedback-estudantes
          Throttle:
            RateLimit: 10
            BurstLimit: 20
          Quota:
            Limit: 10000
            Period: DAY
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  # ---------- recebe-avaliacao ----------
  RecebeAvaliacaoLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tc4-recebe-avaliacao
      RetentionInDays: 14

  RecebeAvaliacaoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: recebe-avaliacao-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GravarAvaliacao
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AvaliacoesTable.Arn
              - Sid: EscreverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${RecebeAvaliacaoLogGroup.Arn}'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'          # X-Ray não suporta restrição por recurso

  RecebeAvaliacaoFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tc4-recebe-avaliacao
      CodeUri: recebe-avaliacao/target/function.zip
      Role: !GetAtt RecebeAvaliacaoRole.Arn
      LoggingConfig:
        LogGroup: !Ref RecebeAvaliacaoLogGroup
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live       # SnapStart só vale para versões publicadas; a API chama o alias
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
      Events:
        PostAvaliacao:
          Type: Api
          Properties:
            RestApiId: !Ref AvaliacaoApi
            Path: /avaliacao
            Method: POST

  # ---------- notifica-urgencia ----------
  NotificaUrgenciaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tc4-notifica-urgencia
      RetentionInDays: 14

  NotificaUrgenciaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: notifica-urgencia-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LerStream
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !Sub '${AvaliacoesTable.Arn}/stream/*'
              - Sid: PublicarAlerta
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertasCriticosTopic
              - Sid: CifrarAlerta
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt AlertasKey.Arn
              - Sid: EscreverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${NotificaUrgenciaLogGroup.Arn}'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'          # X-Ray não suporta restrição por recurso

  NotificaUrgenciaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tc4-notifica-urgencia
      CodeUri: notifica-urgencia/target/function.zip
      Role: !GetAtt NotificaUrgenciaRole.Arn
      LoggingConfig:
        LogGroup: !Ref NotificaUrgenciaLogGroup
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          TOPICO_ALERTAS: !Ref AlertasCriticosTopic
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
      Events:
        AvaliacaoCritica:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AvaliacoesTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:         # só inserções CRITICA chegam na função (não há cobrança pelos descartados)
              Filters:
                - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"urgencia": {"S": ["CRITICA"]}}}}'

  # ---------- gera-relatorio ----------
  GeraRelatorioLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/tc4-gera-relatorio
      RetentionInDays: 14

  GeraRelatorioRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: gera-relatorio-minimo
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsultarAvaliacoes
                Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt AvaliacoesTable.Arn
              - Sid: SalvarRelatorio
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${RelatoriosBucket.Arn}/relatorios/*'
              - Sid: PublicarRelatorio
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref RelatorioSemanalTopic
              - Sid: EscreverLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${GeraRelatorioLogGroup.Arn}'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: '*'          # X-Ray não suporta restrição por recurso

  GeraRelatorioFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tc4-gera-relatorio
      CodeUri: gera-relatorio/target/function.zip
      Role: !GetAtt GeraRelatorioRole.Arn
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref GeraRelatorioLogGroup
      SnapStart:
        ApplyOn: PublishedVersions
      AutoPublishAlias: live
      Environment:
        Variables:
          TABELA_AVALIACOES: !Ref AvaliacoesTable
          BUCKET_RELATORIOS: !Ref RelatoriosBucket
          TOPICO_RELATORIO: !Ref RelatorioSemanalTopic
          JAVA_TOOL_OPTIONS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
      Events:
        Semanal:
          Type: ScheduleV2
          Properties:
            Name: tc4-relatorio-semanal
            Description: Relatorio da semana anterior (seg a dom), toda segunda 08:00 BRT
            ScheduleExpression: cron(0 8 ? * MON *)
            ScheduleExpressionTimezone: America/Sao_Paulo
            Input: '{}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 3600

  # ---------- Monitoramento ----------
  RecebeAvaliacaoErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tc4-recebe-avaliacao-erros
      AlarmDescription: Erro na funcao que recebe avaliacoes (POST /avaliacao)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RecebeAvaliacaoFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertasCriticosTopic

  NotificaUrgenciaErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tc4-notifica-urgencia-erros
      AlarmDescription: Erro na funcao que envia alertas de avaliacoes criticas
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificaUrgenciaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertasCriticosTopic

  GeraRelatorioErrosAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: tc4-gera-relatorio-erros
      AlarmDescription: Erro na funcao do relatorio semanal
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GeraRelatorioFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertasCriticosTopic

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: tc4-feedback
      DashboardBody: !Sub |
        {
          "start": "-P7D",
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 1,
             "properties": {"markdown": "## TC4 Feedback — avaliações, alertas e relatório semanal (${AWS::Region})"}},

            {"type": "metric", "x": 0, "y": 1, "width": 12, "height": 6,
             "properties": {"title": "Avaliações por urgência", "region": "${AWS::Region}", "view": "timeSeries",
               "stacked": true, "stat": "Sum", "period": 3600,
               "metrics": [
                 ["TC4Feedback", "Avaliacoes", "Urgencia", "CRITICA", {"label": "CRÍTICA", "color": "#d62728"}],
                 ["...", "MEDIA", {"label": "MÉDIA", "color": "#ff7f0e"}],
                 ["...", "BAIXA", {"label": "BAIXA", "color": "#2ca02c"}]
               ]}},
            {"type": "metric", "x": 12, "y": 1, "width": 6, "height": 6,
             "properties": {"title": "Total por urgência (período)", "region": "${AWS::Region}", "view": "pie",
               "stat": "Sum", "period": 604800, "setPeriodToTimeRange": true,
               "metrics": [
                 ["TC4Feedback", "Avaliacoes", "Urgencia", "CRITICA", {"label": "CRÍTICA", "color": "#d62728"}],
                 ["...", "MEDIA", {"label": "MÉDIA", "color": "#ff7f0e"}],
                 ["...", "BAIXA", {"label": "BAIXA", "color": "#2ca02c"}]
               ]}},
            {"type": "metric", "x": 18, "y": 1, "width": 6, "height": 6,
             "properties": {"title": "Média das notas (período)", "region": "${AWS::Region}", "view": "singleValue",
               "stat": "Average", "period": 604800, "setPeriodToTimeRange": true,
               "metrics": [["TC4Feedback", "Nota", {"label": "Nota média"}]]}},

            {"type": "metric", "x": 0, "y": 7, "width": 8, "height": 6,
             "properties": {"title": "Invocações", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Invocations", "FunctionName", "${RecebeAvaliacaoFunction}", {"label": "recebe-avaliacao"}],
                 ["...", "${NotificaUrgenciaFunction}", {"label": "notifica-urgencia"}],
                 ["...", "${GeraRelatorioFunction}", {"label": "gera-relatorio"}]
               ]}},
            {"type": "metric", "x": 8, "y": 7, "width": 8, "height": 6,
             "properties": {"title": "Erros", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Errors", "FunctionName", "${RecebeAvaliacaoFunction}", {"label": "recebe-avaliacao"}],
                 ["...", "${NotificaUrgenciaFunction}", {"label": "notifica-urgencia"}],
                 ["...", "${GeraRelatorioFunction}", {"label": "gera-relatorio"}]
               ]}},
            {"type": "metric", "x": 16, "y": 7, "width": 8, "height": 6,
             "properties": {"title": "Duração (p95, ms)", "region": "${AWS::Region}", "stat": "p95", "period": 300,
               "metrics": [
                 ["AWS/Lambda", "Duration", "FunctionName", "${RecebeAvaliacaoFunction}", {"label": "recebe-avaliacao"}],
                 ["...", "${NotificaUrgenciaFunction}", {"label": "notifica-urgencia"}],
                 ["...", "${GeraRelatorioFunction}", {"label": "gera-relatorio"}]
               ]}},

            {"type": "metric", "x": 0, "y": 13, "width": 12, "height": 6,
             "properties": {"title": "API Gateway — requisições e erros", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
               "metrics": [
                 ["AWS/ApiGateway", "Count", "ApiName", "tc4-feedback-api", "Stage", "${Stage}", {"label": "Requisições"}],
                 [".", "4XXError", ".", ".", ".", ".", {"label": "4XX (validação / sem API key)", "color": "#ff7f0e"}],
                 [".", "5XXError", ".", ".", ".", ".", {"label": "5XX", "color": "#d62728"}]
               ]}},
            {"type": "metric", "x": 12, "y": 13, "width": 6, "height": 6,
             "properties": {"title": "API Gateway — latência (ms)", "region": "${AWS::Region}", "period": 300,
               "metrics": [
                 ["AWS/ApiGateway", "Latency", "ApiName", "tc4-feedback-api", "Stage", "${Stage}", {"stat": "p50", "label": "p50"}],
                 ["...", {"stat": "p95", "label": "p95"}]
               ]}},
            {"type": "alarm", "x": 18, "y": 13, "width": 6, "height": 6,
             "properties": {"title": "Alarmes",
               "alarms": ["${RecebeAvaliacaoErrosAlarm.Arn}", "${NotificaUrgenciaErrosAlarm.Arn}", "${GeraRelatorioErrosAlarm.Arn}"]}}
          ]
        }

Outputs:
  ApiUrl:
    Description: Endpoint POST /avaliacao
    Value: !Sub 'https://${AvaliacaoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/avaliacao'
  ApiKeyId:
    Description: "Id da API key (valor: aws apigateway get-api-key --api-key <id> --include-value)"
    Value: !Ref AvaliacaoApiApiKey
  TabelaAvaliacoes:
    Value: !Ref AvaliacoesTable
  RecebeAvaliacaoFunctionAlias:
    Value: !Ref RecebeAvaliacaoFunctionAliaslive
  TopicoAlertasCriticos:
    Value: !Ref AlertasCriticosTopic
  TopicoRelatorioSemanal:
    Value: !Ref RelatorioSemanalTopic
  BucketRelatorios:
    Value: !Ref RelatoriosBucket
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/tc4-feedback'
